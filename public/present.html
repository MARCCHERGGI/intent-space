<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>JARVIS · Intent Space Council</title>
<link rel="stylesheet" href="/present.css" />
</head>
<body class="pre-wake">

<!-- JARVIS v1 Earth scene — Three.js, ported from JARVIS_HOME -->
<div id="earth-mount" class="earth-mount"></div>
<div class="vignette"></div>
<div class="grid"></div>
<div class="scan-line"></div>

<!-- PRE-WAKE OVERLAY — minimal: just the JARVIS pulse + space hint -->
<section id="pre-wake" class="pre-wake-overlay">
  <div class="pw-pulse"></div>
  <div class="pw-brand">JARVIS</div>
  <div class="pw-sub">INTENT SPACE COUNCIL</div>
  <div class="pw-hint">PRESS <kbd>SPACE</kbd> TO BEGIN</div>
</section>

<header class="topbar awake-only">
  <div class="logo-block">
    <span class="logo-dot"></span>
    <span class="brand">JARVIS</span>
    <span class="sep">·</span>
    <span class="sub">Intent Space Council</span>
  </div>
  <div class="status-block">
    <span id="phase" class="phase">STANDBY</span>
    <span id="time" class="time">—</span>
  </div>
</header>

<main class="stage awake-only">

  <!-- AGENT STATUS BAR — 4 cards, the only content -->
  <section class="agent-bar">
    <div class="agent-card" data-agent="OPPORTUNITY">
      <div class="ac-mark">▲</div>
      <div class="ac-meta">
        <div class="ac-name">OPPORTUNITY</div>
        <div class="ac-status" data-status="standby">STANDBY</div>
      </div>
      <div class="ac-text">awaiting signal</div>
    </div>
    <div class="agent-card" data-agent="RISK">
      <div class="ac-mark">▼</div>
      <div class="ac-meta">
        <div class="ac-name">RISK</div>
        <div class="ac-status" data-status="standby">STANDBY</div>
      </div>
      <div class="ac-text">awaiting signal</div>
    </div>
    <div class="agent-card" data-agent="REALITY">
      <div class="ac-mark">●</div>
      <div class="ac-meta">
        <div class="ac-name">REALITY</div>
        <div class="ac-status" data-status="standby">STANDBY</div>
      </div>
      <div class="ac-text">awaiting signal</div>
    </div>
    <div class="agent-card" data-agent="SYNTHESIS">
      <div class="ac-mark">◇</div>
      <div class="ac-meta">
        <div class="ac-name">SYNTHESIS</div>
        <div class="ac-status" data-status="standby">STANDBY</div>
      </div>
      <div class="ac-text">awaits ≥2 quorum</div>
    </div>
  </section>

  <div class="spacer"></div>

  <!-- Active signal — single line, big, center -->
  <section class="signal-block">
    <div class="block-eyebrow">CURRENT INTENT</div>
    <div id="signal-text" class="signal-text">—</div>
  </section>

  <!-- Synthesis result — appears only when council converges -->
  <section class="synthesis-block" id="synthesis-block">
    <div class="syn-row">
      <span class="syn-key">INSIGHT</span>
      <span id="syn-insight" class="syn-val">—</span>
    </div>
    <div class="syn-row">
      <span class="syn-key">ACTION</span>
      <span id="syn-action" class="syn-val">—</span>
    </div>
  </section>

</main>

<!-- Hidden orbital scaffolding kept for present.js compatibility (no visual weight) -->
<div class="orbital-hidden" aria-hidden="true">
  <div class="lens" data-agent="OPPORTUNITY"><span class="lens-take"></span></div>
  <div class="lens" data-agent="RISK"><span class="lens-take"></span></div>
  <div class="lens" data-agent="REALITY"><span class="lens-take"></span></div>
  <div class="core" id="core"></div>
</div>

<!-- Tiny anchored controls — only visible when awake -->
<aside class="hud-controls awake-only">
  <button id="run-btn" class="cta-btn">
    <span class="cta-mark">▶</span>
    <span>RUN AGAIN</span>
  </button>
  <button id="mic-btn" class="cta-btn ghost">
    <span class="cta-mark">🎤</span>
    <span>SPEAK</span>
  </button>
  <a id="obs-link" class="cta-link" target="_blank" rel="noopener">↗ OBSERVATORY</a>
</aside>

<!-- Hidden mounts for the snapshot rehydrator (kept for present.js compat) -->
<span id="hud-home" hidden></span>
<span id="hud-native" hidden></span>
<div id="hud-feed" hidden></div>

<script type="module">
  import { mountJarvisEarth } from '/jarvis-earth.js';
  const m = document.getElementById('earth-mount');
  if (m) {
    try { mountJarvisEarth(m); }
    catch (e) { console.warn('[earth] mount failed', e); m.classList.add('failed'); }
  }
</script>
<script src="/present.js"></script>
</body>
</html>
